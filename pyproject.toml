[project]
name = "vrucare"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.ruff]
target-version = "py313"
# migrations: generated by Django. *.md: ruff would reformat the code examples in the docs.
extend-exclude = ["**/migrations/*", "*.md"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B likely bugs, UP outdated syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "config.settings.dev"
