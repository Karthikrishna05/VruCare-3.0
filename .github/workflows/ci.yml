name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vrucare
          POSTGRES_PASSWORD: vrucare
          POSTGRES_DB: vrucare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vrucare -d vrucare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    
    env:
      SECRET_KEY: ci-only-not-a real-secret
      DATABASE_URL: postgres://vrucare:vrucare@127.0.0.1:5432/vrucare
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
